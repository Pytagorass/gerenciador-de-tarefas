spring.application.name=gerenciador-tarefas

# Conexão com o banco
spring.datasource.url=jdbc:mysql://localhost:3306/gerenciador_tarefas
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Credenciais obrigatórias do usuário acadêmico em memória
app.login.email=${APP_LOGIN_EMAIL}
app.login.password=${APP_LOGIN_PASSWORD}

# Criação e atualização das tabelas durante o desenvolvimento
spring.jpa.hibernate.ddl-auto=update

# Exibição dos comandos SQL no terminal
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

# Atualização das páginas durante o desenvolvimento
spring.thymeleaf.cache=false

server.port=8080
