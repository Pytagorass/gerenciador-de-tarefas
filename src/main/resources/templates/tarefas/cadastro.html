<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="${edicao == true ? 'Editar tarefa' : 'Nova tarefa'}">Nova tarefa</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>

<body>
<header class="cabecalho py-3">
    <div class="container d-flex flex-wrap align-items-center justify-content-between gap-3">
        <a class="text-white text-decoration-none fs-4 fw-bold"
           th:href="@{/tarefas}">
            Gerenciador de Tarefas
        </a>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button class="btn btn-principal" type="submit">Sair</button>
        </form>
    </div>
</header>

<main class="container py-5">

    <div class="d-flex flex-wrap justify-content-between
                align-items-center gap-3 mb-4">
        <div>
            <h1 class="h2 fw-bold"
                th:text="${edicao == true ? 'Editar tarefa' : 'Nova tarefa'}">Nova tarefa</h1>

            <p class="text-secondary mb-0"
               th:text="${edicao == true ? 'Atualize os dados da atividade.' :
                   'Preencha os dados para organizar uma atividade.'}">
                Preencha os dados para organizar uma atividade.
            </p>
        </div>

        <a class="btn btn-secundario" th:href="@{/tarefas}">
            Voltar para tarefas
        </a>
    </div>

    <section class="card shadow-sm"
             th:aria-label="${edicao == true ? 'Edição de tarefa' : 'Cadastro de tarefa'}">
        <div class="card-body p-4">

            <p class="text-secondary small">
                Todos os campos são obrigatórios.
            </p>

            <div th:if="${edicao == true}" class="mb-4">
                <p class="mb-1">
                    <span class="fw-semibold">Finalização: </span>
                    <span th:text="${dataFinalizacao != null ?
                        #temporals.format(dataFinalizacao, 'dd/MM/yyyy HH:mm') : 'Não registrada'}">
                        Não registrada
                    </span>
                </p>
                <p class="text-secondary small mb-0">
                    A data é preenchida automaticamente ao concluir a tarefa.
                </p>
            </div>

            <form th:action="${edicao == true} ? @{/tarefas/{id}/editar(id=${idTarefa})} : @{/tarefas}"
                  th:object="${tarefa}"
                  method="post">

                <div class="alert alert-danger"
                     role="alert"
                     th:if="${#fields.hasAnyErrors()}">
                    Revise os campos indicados antes de salvar.
                </div>

                <div class="mb-3">
                    <label for="nome" class="form-label">
                        Nome da tarefa
                    </label>

                    <input id="nome"
                           type="text"
                           class="form-control"
                           th:field="*{nome}"
                           th:errorclass="is-invalid"
                           maxlength="100"
                           placeholder="Ex.: Preparar apresentação de Java"
                           required>

                    <div class="invalid-feedback"
                         th:errors="*{nome}">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="descricao" class="form-label">
                        Descrição
                    </label>

                    <textarea id="descricao"
                              class="form-control"
                              th:field="*{descricao}"
                              th:errorclass="is-invalid"
                              rows="4"
                              maxlength="1000"
                              placeholder="Descreva o que precisa ser feito"
                              required></textarea>

                    <div class="invalid-feedback"
                         th:errors="*{descricao}">
                    </div>
                </div>

                <div class="row g-3 mb-4">

                    <div class="col-md-4">
                        <label for="dataLimite" class="form-label">
                            Data limite
                        </label>

                        <input id="dataLimite"
                               type="date"
                               class="form-control"
                               th:field="*{dataLimite}"
                               th:errorclass="is-invalid"
                               required>

                        <div class="invalid-feedback"
                             th:errors="*{dataLimite}">
                        </div>
                    </div>

                    <div class="col-md-4">
                        <label for="prioridade" class="form-label">
                            Prioridade
                        </label>

                        <select id="prioridade"
                                class="form-select"
                                th:field="*{prioridade}"
                                th:errorclass="is-invalid"
                                required>

                            <option value="">Selecione</option>

                            <option th:each="p : ${prioridades}"
                                    th:value="${p}"
                                    th:text="${p.descricao}">
                            </option>
                        </select>

                        <div class="invalid-feedback"
                             th:errors="*{prioridade}">
                        </div>
                    </div>

                    <div class="col-md-4">
                        <label for="status" class="form-label">
                            Status
                        </label>

                        <select id="status"
                                class="form-select"
                                th:field="*{status}"
                                th:errorclass="is-invalid"
                                required>

                            <option th:each="s : ${statusDisponiveis}"
                                    th:value="${s}"
                                    th:text="${s.descricao}">
                            </option>
                        </select>

                        <div class="invalid-feedback"
                             th:errors="*{status}">
                        </div>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button class="btn btn-principal" type="submit"
                            th:text="${edicao == true ? 'Salvar alterações' : 'Salvar tarefa'}">
                        Salvar tarefa
                    </button>

                    <a class="btn btn-secundario" th:href="@{/tarefas}">
                        Cancelar
                    </a>
                </div>

            </form>
        </div>
    </section>
</main>
</body>
</html>
