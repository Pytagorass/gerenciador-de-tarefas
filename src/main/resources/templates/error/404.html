<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tarefa não encontrada | Gerenciador de Tarefas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<header class="cabecalho py-3">
    <div class="container">
        <a class="text-white text-decoration-none fs-4 fw-bold" th:href="@{/tarefas}">
            Gerenciador de Tarefas
        </a>
    </div>
</header>
<main class="container py-5">
    <section class="card shadow-sm" aria-labelledby="titulo-erro">
        <div class="card-body p-4">
            <p class="text-secondary">Erro 404</p>
            <h1 id="titulo-erro" class="h2 fw-bold">Tarefa não encontrada</h1>
            <p>A tarefa solicitada não foi encontrada. Volte à listagem para consultar as atividades disponíveis.</p>
            <a class="btn btn-principal" th:href="@{/tarefas}">Voltar para tarefas</a>
        </div>
    </section>
</main>
</body>
</html>
