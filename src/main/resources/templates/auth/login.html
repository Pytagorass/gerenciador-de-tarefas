<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Login | Gerenciador de Tarefas</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>

<body>
<main class="login-pagina container">
    <section class="login-cartao card shadow-sm" aria-labelledby="titulo-login">
        <div class="card-body p-4 p-sm-5">
            <h1 id="titulo-login" class="login-titulo h3 fw-bold">
                Gerenciador de Tarefas
            </h1>

            <p class="text-secondary mb-4">
                Entre para organizar suas atividades
            </p>

            <div class="alert alert-danger" role="alert" th:if="${param.error != null}">
                E-mail ou senha inválidos
            </div>

            <div class="alert alert-success" role="status" th:if="${param.logout != null}">
                Você saiu do sistema
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input id="email"
                           name="username"
                           type="email"
                           class="form-control"
                           autocomplete="username"
                           autocapitalize="none"
                           spellcheck="false"
                           required>
                </div>

                <div class="mb-4">
                    <label for="senha" class="form-label">Senha</label>
                    <input id="senha"
                           name="password"
                           type="password"
                           class="form-control"
                           autocomplete="current-password"
                           required>
                </div>

                <button class="btn btn-principal w-100" type="submit">
                    Entrar
                </button>
            </form>
        </div>
    </section>
</main>
</body>
</html>
